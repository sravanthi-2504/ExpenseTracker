name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Verify Docker Build (The "CI" Step)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # We only want to verify it builds correctly
          tags: expense-tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max